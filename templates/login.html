<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            /* background: linear-gradient(135deg,#020617 100%,#0f172a 100%,#1e293b 100%);
    background-repeat: repeat; */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 150px;
        }

        h1 {
            display: flex;
            align-items: center;
            color: white;
            font-family: sans-serif;
            padding-left: 20px;
            border: 1px solid;
            width: 500px;
            height: 100px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background-color: rgba(255, 68, 0, 0.7);
        }

        .card-body {
            width: 520px;
            height: auto;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            background: rgb(227, 226, 226);
        }

        form {
            margin-top: 50px;
        }

        .login {
            margin-bottom: 0px;
            font-size: 20px;
            font-family: sans-serif;
            color: rgb(106, 105, 105, 0.6);
            margin-left: 20px;
        }

        .in {
            padding-left: 10px;
            font-size: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 20px;
            height: 30px;
            width: 470px;
            border-radius: 5px;
            border: 1px solid rgb(119, 119, 119, 0.5);
        }

        .submit {
            font-size: 15px;
            margin: 20px;
            height: 30px;
            width: 60px;
            border-radius: 5px;
            border: solid rgba(255, 68, 0, 0.7);
            color: rgba(255, 68, 0, 0.7);
        }

        p {
            font-size: 20px;
            font-family: sans-serif;
            color: rgb(106, 105, 105, 0.6);
            margin-left: 20px;
            margin-bottom: 20px;
        }

        a {
            font-family: sans-serif;
            color: rgb(106, 105, 105, 0.6);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Login Page</h1>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <p style="color:red">{{ error }}</p>
                <label class="login">Username :</label>
                <input class="in" type="text" name="username"><br>
                <label class="login">Password :</label>
                <input class="in" type="password" name="password"><br>
                <input class="submit" type="submit">
            </form>
        <p>Don't have an account?<a href="/register/">register</a></p>
        </div>
    </div>
</body>

</html>
